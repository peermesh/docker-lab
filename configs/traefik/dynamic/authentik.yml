# ==============================================================
# Traefik Dynamic Configuration - Authentik Forward Auth
# ==============================================================
# Production PeerMesh forward-auth middleware chains.
#
# peermesh-auth@file       - ordinary router-facing chain
# peermesh-admin-auth@file - admin router-facing chain
#
# This file preserves the live middleware names observed on the VPS. It does
# not attach those chains to any module router by itself.
# ==============================================================

http:
  middlewares:
    peermesh-strip-spoofed-identity:
      headers:
        customRequestHeaders:
          X-Peermesh-Auth-Subject: ""
          X-Peermesh-Actor-WebID: ""
          X-Peermesh-Tenant-ID: ""
          X-Peermesh-Property-ID: ""
          X-Peermesh-Roles: ""
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-entitlements: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
          X-authentik-meta-jwks: ""
          X-authentik-meta-outpost: ""
          X-authentik-meta-provider: ""
          X-authentik-meta-app: ""
          X-authentik-meta-version: ""

    peermesh-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Peermesh-Auth-Subject
          - X-Peermesh-Actor-WebID
          - X-Peermesh-Tenant-ID
          - X-Peermesh-Property-ID
          - X-Peermesh-Roles

    peermesh-admin-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Peermesh-Auth-Subject
          - X-Peermesh-Actor-WebID
          - X-Peermesh-Tenant-ID
          - X-Peermesh-Property-ID
          - X-Peermesh-Roles

    peermesh-strip-edge-credentials:
      headers:
        customRequestHeaders:
          Authorization: ""
          Cookie: ""
          X-Authentik-Jwt: ""

    peermesh-auth:
      chain:
        middlewares:
          - peermesh-strip-spoofed-identity
          - peermesh-forward-auth
          - peermesh-strip-edge-credentials

    peermesh-admin-auth:
      chain:
        middlewares:
          - peermesh-strip-spoofed-identity
          - peermesh-admin-forward-auth
          - peermesh-strip-edge-credentials
