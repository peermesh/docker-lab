# PeerMesh Events local/sandbox gateway attachment proof.
# This file is intentionally standalone and must never be included in production.
services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
      - "--log.level=INFO"
    ports:
      - "127.0.0.1:${EVENTS_SANDBOX_PORT:-18080}:80"
      - "127.0.0.1:${EVENTS_SANDBOX_API_PORT:-18081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      events-sandbox:
        aliases:
          - events.localhost

  authentik-server:
    image: pm-module-events:local
    command: ["node", "/fixture/events-forward-auth.mjs"]
    volumes:
      - ./scripts/validation/fixtures/events-forward-auth.mjs:/fixture/events-forward-auth.mjs:ro
    networks:
      - events-sandbox

  pm-module-events:
    build:
      context: "${EVENTS_BUILD_CONTEXT:-../../../pm-module-events}"
      dockerfile: Dockerfile
    image: pm-module-events:local
    environment:
      EVENTS_EVENT_BUS_MODE: noop
      EVENTS_PORT: "3080"
      PORT: "3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/events/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.events-sandbox.loadbalancer.server.port=3080"
      - "traefik.http.routers.events-sandbox-health.rule=Host(`${EVENTS_SANDBOX_HOST:-events.localhost}`) && Path(`/api/events/health`) && Method(`GET`)"
      - "traefik.http.routers.events-sandbox-health.entrypoints=web"
      - "traefik.http.routers.events-sandbox-health.priority=300"
      - "traefik.http.routers.events-sandbox-health.service=events-sandbox"
      - "traefik.http.routers.events-sandbox-write-30.rule=Host(`${EVENTS_SANDBOX_HOST:-events.localhost}`) && ((Method(`POST`) && Path(`/api/events`)) || ((Method(`PATCH`) || Method(`DELETE`)) && Path(`/api/events/{id:[^/]+}`)) || (Method(`POST`) && Path(`/api/events/{id:[^/]+}/{action:submit|withdraw}`)))"
      - "traefik.http.routers.events-sandbox-write-30.entrypoints=web"
      - "traefik.http.routers.events-sandbox-write-30.priority=200"
      - "traefik.http.routers.events-sandbox-write-30.middlewares=peermesh-auth@file,events-ratelimit-30-per-hour@file"
      - "traefik.http.routers.events-sandbox-write-30.service=events-sandbox"
      - "traefik.http.routers.events-sandbox-write-60.rule=Host(`${EVENTS_SANDBOX_HOST:-events.localhost}`) && Method(`POST`) && (Path(`/api/events/{id:[^/]+}/rsvps`) || Path(`/api/admin/events/{id:[^/]+}/{action:review|approve|reject|request-revision}`))"
      - "traefik.http.routers.events-sandbox-write-60.entrypoints=web"
      - "traefik.http.routers.events-sandbox-write-60.priority=200"
      - "traefik.http.routers.events-sandbox-write-60.middlewares=peermesh-auth@file,events-ratelimit-60-per-hour@file"
      - "traefik.http.routers.events-sandbox-write-60.service=events-sandbox"
      - "traefik.http.routers.events-sandbox-read-120.rule=Host(`${EVENTS_SANDBOX_HOST:-events.localhost}`) && ((Method(`GET`) && (PathPrefix(`/api/events`) || Path(`/api/admin/events/queue`))) || (Method(`POST`) && Path(`/api/events/{id:[^/]+}/attendance/check-in`)))"
      - "traefik.http.routers.events-sandbox-read-120.entrypoints=web"
      - "traefik.http.routers.events-sandbox-read-120.priority=100"
      - "traefik.http.routers.events-sandbox-read-120.middlewares=peermesh-auth@file,events-ratelimit-120-per-hour@file"
      - "traefik.http.routers.events-sandbox-read-120.service=events-sandbox"
    networks:
      - events-sandbox

  sandbox-client-a:
    image: pm-module-events:local
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    networks:
      events-sandbox:
        ipv4_address: 172.30.80.20

  sandbox-client-b:
    image: pm-module-events:local
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    networks:
      events-sandbox:
        ipv4_address: 172.30.80.21

  sandbox-client-c:
    image: pm-module-events:local
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    networks:
      events-sandbox:
        ipv4_address: 172.30.80.22

  sandbox-client-d:
    image: pm-module-events:local
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    networks:
      events-sandbox:
        ipv4_address: 172.30.80.23

networks:
  events-sandbox:
    name: pmdl-events-sandbox
    ipam:
      config:
        - subnet: 172.30.80.0/24
